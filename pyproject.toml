[project]
name = "dnd-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Oleg Skakunov", email = "dosmds@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.1",
    "watchfiles>=1.2.0",
]

[project.scripts]
dnd = "dnd_assistant.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
